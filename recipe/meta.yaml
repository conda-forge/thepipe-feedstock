{% set name = "thepipe" %}
{% set version = "1.3.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/thepipe-{{ version }}.tar.gz
  sha256: b1fea009984c44059defd0809e09f7a2c16782433d28b1414d50f3d4647d92c9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.5
    - setuptools_scm
  run:
    - numpy
    - pip >=9
    - psutil
    - python >=3.5
    - python-dateutil
    - pytz
    - setuptools_scm
    - toml

test:
  imports:
    - thepipe
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/tamasgal/thepipe
  summary: A lightweight, general purpose pipeline framework.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tamasgal
